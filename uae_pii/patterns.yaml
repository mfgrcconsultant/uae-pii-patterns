# UAE PII Patterns — single source of truth.
# Every export (Python, Presidio, Purview, Forcepoint, generic regex) is built from this file.
# Regexes avoid tool-specific features so they work in Python, .NET and most DLP engines.

version: "1.0.0"
proximity: 300   # characters before/after a match searched for keywords

entities:
  - id: uae_emirates_id
    name: UAE Emirates ID Number
    presidio_entity: UAE_EMIRATES_ID
    description: >-
      15-digit Emirates ID: 784 (UAE country code), 4-digit birth year,
      7-digit sequence, 1 check digit. Often written 784-YYYY-NNNNNNN-C.
    regex: '(?<!\d)784[-\s]?(?:19|20)\d{2}[-\s]?\d{7}[-\s]?\d(?!\d)'
    validator: luhn
    confidence: high
    keyword_required: false
    keywords: [emirates id, eid, emirates identity, id card, identity card, رقم الهوية, الهوية الإماراتية, بطاقة الهوية]
    example: 784-1990-1234567-X

  - id: uae_iban
    name: UAE IBAN
    presidio_entity: UAE_IBAN
    description: >-
      23-character IBAN: AE + 2 check digits + 3-digit bank code + 16-digit account.
      Validated with the ISO 13616 mod-97 checksum.
    regex: '(?<![A-Z0-9])AE\d{2}(?:\s?\d{4}){4}\s?\d{3}(?!\d)'
    validator: iban_mod97
    confidence: high
    keyword_required: false
    keywords: [iban, bank account, account number, beneficiary, آيبان, رقم الحساب, الحساب المصرفي]
    example: AE07 0331 2345 6789 0123 456

  - id: uae_mobile
    name: UAE Mobile Number
    presidio_entity: UAE_MOBILE
    description: >-
      UAE mobile in international (+971 / 00971) or local (05X) format.
    regex: '(?<![\d+])(?:\+971|00971|0)[-\s]?5\d[-\s]?\d{3}[-\s]?\d{4}(?!\d)'
    validator: null
    confidence: medium
    keyword_required: false
    keywords: [mobile, phone, tel, contact, whatsapp, هاتف, جوال, متحرك, رقم الهاتف]
    example: +971 50 123 4567

  - id: uae_landline
    name: UAE Landline Number
    presidio_entity: UAE_LANDLINE
    description: >-
      UAE landline with single-digit area code: 2 Abu Dhabi, 3 Al Ain, 4 Dubai,
      6 Sharjah/Ajman/UAQ, 7 Ras Al Khaimah, 9 Fujairah.
    regex: '(?<![\d+])(?:\+971|00971|0)[-\s]?[234679][-\s]?\d{3}[-\s]?\d{4}(?!\d)'
    validator: null
    confidence: low
    keyword_required: false
    keywords: [phone, tel, telephone, office, landline, fax, هاتف, رقم الهاتف]
    example: +971 4 123 4567

  - id: uae_trn
    name: UAE Tax Registration Number (TRN)
    presidio_entity: UAE_TRN
    description: >-
      15-digit VAT/Corporate Tax Registration Number issued by the Federal Tax Authority.
      Commonly begins with 100. Keyword required to limit false positives.
    regex: '(?<!\d)1\d{14}(?!\d)'
    validator: null
    confidence: medium
    keyword_required: true
    keywords: [trn, tax registration number, vat number, vat registration, tax number, الرقم الضريبي, رقم التسجيل الضريبي]
    example: "100123456700003"

  - id: uae_passport
    name: UAE Passport Number
    presidio_entity: UAE_PASSPORT
    description: >-
      Passport number formats vary by issue series. Pattern is deliberately broad
      (optional letter + 7–8 digits) and requires a keyword.
    regex: '(?<![A-Z0-9])[A-Z]?\d{7,8}(?![A-Z0-9])'
    validator: null
    confidence: low
    keyword_required: true
    keywords: [passport, passport no, passport number, جواز السفر, رقم الجواز]
    example: A1234567
